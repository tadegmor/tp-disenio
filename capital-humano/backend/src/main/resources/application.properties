spring.application.name=capital-humano

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:capitalhumanodb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate (el dialecto de H2 se detecta solo)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Carga de data.sql con acentos
spring.sql.init.encoding=UTF-8

# Consola web de H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always
#logging.level.org.springframework.jdbc.datasource.init=DEBUG

# Parametros de los cuestionarios (CU025 / CU026 / CU032)
capitalhumano.cuestionario.cantidad-preguntas-por-factor=2
capitalhumano.cuestionario.cantidad-preguntas-por-bloque=5
# Horas que un cuestionario puede permanecer ACTIVO sin ser iniciado
capitalhumano.cuestionario.tiempo-maximo-activo-horas=72
# Minutos para completarlo desde que se inicia
capitalhumano.cuestionario.tiempo-maximo-completar-minutos=90
capitalhumano.cuestionario.cantidad-maxima-accesos=3