services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capital-humano-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
    networks:
      - tp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    container_name: capital-humano-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - tp-network

networks:
  tp-network:
    driver: bridge